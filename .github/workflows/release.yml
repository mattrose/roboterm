name: Release

# Publishes a GitHub release for a version tag, with the self-contained macOS
# .app bundle (`make bundle`) attached as a zip plus its SHA-256 checksum.
#
# Trigger it by pushing a tag:      git tag v1.0.0 && git push origin v1.0.0
# Or manually from the Actions tab (workflow_dispatch), which creates the tag
# at the selected commit if it doesn't exist yet.
#
# A tag containing a hyphen (v1.0.0-rc1) is published as a pre-release.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to release (e.g. v1.0.0)"
        required: true
        type: string
      draft:
        description: "Create the release as a draft"
        required: false
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  # ── Gate: the mocked-gi unit suite runs anywhere, so it costs a minute and
  # keeps a broken tree from ever reaching a published release. ───────────────
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install test deps
        run: python -m pip install --upgrade pip pytest

      - name: Run unit tests
        run: pytest tests/unit/ -q

  # ── Build the distributable .app on macOS ──────────────────────────────────
  build-macos:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-14, not macos-15, on purpose. Homebrew bottles carry the
          # minimum OS of the machine they were built on, and the whole GTK
          # stack gets bundled — so a macos-15 build produces an app that
          # LaunchServices refuses on macOS 14 with kLSIncompatibleSystemVersionErr.
          # Building on 14 yields a bundle that runs on 14 and on 15+.
          - runner: macos-14
            arch: arm64
          # Add an Intel row here if/when an x86_64 runner is available, e.g.
          # - { runner: macos-13, arch: x86_64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve the release version from the tag
        id: version
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          # CFBundleVersion must be digits and dots only, so drop any
          # pre-release suffix (1.0.0-rc1 -> 1.0.0).
          echo "tag=$TAG"                      >> "$GITHUB_OUTPUT"
          echo "version=$VERSION"              >> "$GITHUB_OUTPUT"
          echo "numeric=${VERSION%%-*}"        >> "$GITHUB_OUTPUT"

      - name: Install the GTK4/VTE stack
        run: |
          set -euo pipefail
          brew update
          # libadwaita is listed explicitly because nothing else here pulls it
          # in — gtk4, vte3, pygobject3 and adwaita-icon-theme all resolve
          # without it — while roboterm requires Adw-1 at import time.
          brew install gtk4 vte3 pygobject3 adwaita-icon-theme libadwaita

      - name: Locate the Homebrew Python that owns PyGObject
        id: python
        run: |
          set -euo pipefail
          # The bundle must be built with the interpreter that can import `gi`:
          # macos/bundle_deps.py derives the Homebrew prefix and the site-packages
          # it copies from *that* interpreter, and the Makefile embeds its
          # libpython in the launcher. The runner's preinstalled python3 shadows
          # Homebrew's on PATH and has no gi, so resolve it explicitly from the
          # python@3.x formula pygobject3 was built against.
          PY_FORMULA="$(brew deps pygobject3 | grep -m1 '^python@3' || true)"
          if [ -z "$PY_FORMULA" ]; then
            echo "::error::No python@3.x in 'brew deps pygobject3' — cannot pick a build interpreter."
            brew deps pygobject3
            exit 1
          fi
          PYTHON="$(brew --prefix "$PY_FORMULA")/bin/python3"
          "$PYTHON" -c 'import gi, cairo; print("gi + cairo OK on", __import__("sys").version)'
          echo "python=$PYTHON" >> "$GITHUB_OUTPUT"

      - name: Stamp the release version into Info.plist
        run: |
          set -euo pipefail
          plutil -replace CFBundleVersion            -string "${{ steps.version.outputs.numeric }}" macos/Info.plist
          plutil -replace CFBundleShortVersionString -string "${{ steps.version.outputs.numeric }}" macos/Info.plist
          plutil -p macos/Info.plist | grep -i bundleversion

      - name: Build the self-contained bundle
        run: make bundle PYTHON="${{ steps.python.outputs.python }}"

      - name: Verify nothing still links against Homebrew
        run: |
          set -euo pipefail
          # `make bundle` promises a bundle that runs on a Mac with no Homebrew.
          # Any Mach-O still naming the Homebrew prefix as a dependency breaks
          # that on a clean machine but not on this runner, so check it here.
          BREW="$(brew --prefix)"
          LEAKED=$(
            find Roboterm.app -type f \( -name '*.dylib' -o -name '*.so' -o -perm +111 \) -print0 \
              | xargs -0 -n1 otool -L 2>/dev/null \
              | grep -E "^[[:space:]]+${BREW}/" || true
          )
          if [ -n "$LEAKED" ]; then
            echo "::error::Bundle still references $BREW:"
            echo "$LEAKED"
            exit 1
          fi
          echo "No Homebrew references — bundle is self-contained."

      - name: Verify every typelib the app requires is in the bundle
        run: |
          set -euo pipefail
          # Typelibs are dlopen'd by name at runtime rather than linked, so a
          # missing one builds cleanly and dies on launch — which is exactly
          # how the first release shipped with no Adw. The list is derived from
          # the source so a new require_version is covered automatically.
          python3 - <<'PY'
          import pathlib, re, sys

          src = pathlib.Path("roboterm/__init__.py").read_text()
          required = re.findall(
              r"""require_version\(\s*["']([\w.]+)["']\s*,\s*["']([\w.]+)["']\s*\)""", src
          )
          if not required:
              sys.exit("::error::No require_version calls found — the parser needs updating.")

          libdir = pathlib.Path("Roboterm.app/Contents/Resources/lib/girepository-1.0")
          missing = []
          for ns, ver in required:
              name = f"{ns}-{ver}.typelib"
              if (libdir / name).exists():
                  print(f"  ok       {name}")
              else:
                  print(f"  MISSING  {name}")
                  missing.append(name)

          if missing:
              sys.exit(f"::error::Bundle is missing typelibs: {', '.join(missing)}")
          print(f"All {len(required)} required typelibs present.")
          PY

      - name: Verify the bundle runs on the macOS version it advertises
        run: |
          set -euo pipefail
          # Every Mach-O records the oldest macOS it will load on, and the
          # bundled Homebrew dylibs inherit that from the runner. Nothing
          # reconciles it with LSMinimumSystemVersion, so the app can claim
          # macOS 12 and be rejected on 14 — which is how the first two
          # releases shipped as 15-only while advertising 12.0.
          DECLARED=$(plutil -extract LSMinimumSystemVersion raw Roboterm.app/Contents/Info.plist)
          REQUIRED=$(
            find Roboterm.app -type f \( -name '*.dylib' -o -name '*.so' -o -perm +111 \) -print0 \
              | xargs -0 -n1 otool -l 2>/dev/null \
              | awk '/^ *minos /{print $2}' \
              | sort -V | tail -1
          )
          echo "Info.plist declares: $DECLARED"
          echo "Bundle actually needs: $REQUIRED"
          # sort -V puts the newer version last; if that is the declared one,
          # the declaration covers everything shipped.
          if [ "$(printf '%s\n%s\n' "$DECLARED" "$REQUIRED" | sort -V | tail -1)" != "$DECLARED" ]; then
            echo "::error::Bundle needs macOS $REQUIRED but Info.plist advertises $DECLARED — it will not launch on $DECLARED."
            exit 1
          fi
          echo "LSMinimumSystemVersion covers everything in the bundle."

      - name: Package
        id: package
        run: |
          set -euo pipefail
          NAME="Roboterm-${{ steps.version.outputs.version }}-macos-${{ matrix.arch }}"
          # ditto (not zip) preserves symlinks, resource forks and the ad-hoc
          # code signature bundle_deps.py applied.
          ditto -c -k --sequesterRsrc --keepParent Roboterm.app "$NAME.zip"
          shasum -a 256 "$NAME.zip" > "$NAME.zip.sha256"
          cat "$NAME.zip.sha256"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: |
            ${{ steps.package.outputs.name }}.zip
            ${{ steps.package.outputs.name }}.zip.sha256
          if-no-files-found: error

  # ── Publish ────────────────────────────────────────────────────────────────
  release:
    needs: build-macos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Write the release notes preamble
        id: notes
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          # A hyphen in the tag (v1.0.0-rc1, v2.0.0-beta) means pre-release.
          case "$TAG" in
            *-*) echo "prerelease=true"  >> "$GITHUB_OUTPUT" ;;
            *)   echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac
          cat > NOTES.md <<'EOF'
          ## Install

          **macOS** — download the `.zip` below, unzip it, and drag `Roboterm.app`
          to `/Applications`. The bundle is self-contained (it ships its own
          Python, GTK4 and VTE), so Homebrew is not needed to run it.

          It is ad-hoc signed rather than notarized, so Gatekeeper will refuse the
          first launch. Clear the quarantine flag once:

          ```sh
          xattr -dr com.apple.quarantine /Applications/Roboterm.app
          ```

          Verify the download against the matching `.sha256` file:

          ```sh
          shasum -a 256 -c Roboterm-*.zip.sha256
          ```

          **Linux** — run from source; see the README.

          EOF
          ls -R dist

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.notes.outputs.tag }}
        run: |
          set -euo pipefail
          FLAGS=(--title "Roboterm ${TAG#v}" --notes-file NOTES.md --generate-notes)
          if [ "${{ steps.notes.outputs.prerelease }}" = "true" ]; then
            FLAGS+=(--prerelease)
          fi
          if [ "${{ github.event.inputs.draft }}" = "true" ]; then
            FLAGS+=(--draft)
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists — replacing its assets."
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --target "$GITHUB_SHA" "${FLAGS[@]}"
          fi
          gh release view "$TAG"
